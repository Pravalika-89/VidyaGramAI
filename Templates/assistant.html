<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidyaGram AI Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fb;
        }

        .chat-box{
            max-width:900px;
            margin:40px auto;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        textarea{
            resize:none;
        }

        .user-box{
            background:#0d6efd;
            color:white;
            padding:15px;
            border-radius:12px;
            margin-top:20px;
        }

        .ai-box{
            background:#f8f9fa;
            padding:15px;
            border-radius:12px;
            margin-top:20px;
            border-left:5px solid #198754;
            white-space:pre-wrap;
        }

        .title{
            font-weight:bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            🤖 VidyaGram AI
        </a>

        <a href="/dashboard" class="btn btn-outline-light">
            Dashboard
        </a>
    </div>
</nav>

<div class="container chat-box">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            AI Career Assistant
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Ask Anything
                </label>

                <textarea
                    class="form-control"
                    name="question"
                    rows="4"
                    placeholder="Example: How can I become a Data Scientist?"
                    required>{{ question }}</textarea>

            </div>

            <button class="btn btn-primary w-100">
                Ask AI
            </button>

        </form>

        {% if question %}

        <div class="user-box">

            <h5 class="title">
                🙋 Your Question
            </h5>

            <p>{{ question }}</p>

        </div>

        {% endif %}

        {% if answer %}

        <div class="ai-box">

            <h5 class="title">
                🤖 AI Response
            </h5>

            <p>{{ answer }}</p>

        </div>

        {% endif %}

    </div>

</div>

</body>
</html>
